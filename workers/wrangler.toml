# Agent Football — Cloudflare Workers config. CONFIG ONLY.
# DO NOT run `wrangler deploy` or `wrangler login` from this repo until the
# user gives explicit deploy go-ahead after the deploy gates pass (DESIGN.md).
# Create the resources first (once, by hand):
#   wrangler d1 create agent_football_db
#   wrangler kv namespace create AGENT_FOOTBALL_KV
# then paste the returned IDs below.
name = "agent-football-api"
main = "src/index.ts"
compatibility_date = "2026-11-27"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "agent_football_db"
database_id = "7b601cd1-45f9-421e-b059-0166432652c6" # created 2026-11-27, schema applied, 16 teams seeded

[[kv_namespaces]]
binding = "AGENT_FOOTBALL_KV"
id = "f10e697d96d64593948564238968f7e6" # created 2026-11-27

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

# NOTE: free plan requires SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]
